[package]
name = "cord"
version = "3.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "cord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
cord-core = { path = "../../../crates/cord-core" }
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
axum = "0.8"
tokio-util = "0.7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Unoptimized bcrypt makes a dev sign-in take over a second.
[profile.dev.package.bcrypt]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.9", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tauri = { version = "2", features = ["test"] }
