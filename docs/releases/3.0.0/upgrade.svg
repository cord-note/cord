<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="On first start, Cord 3.0 copies your notes, tags, attachments and settings from the 2.x database into the new format. The old database is never changed.">
  <style>
    .bg { fill: #f4f4f5; } .box { fill: #ffffff; stroke: #c9c9cf; stroke-width: 1.4; }
    .h { font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #18181b; }
    .s { font: 400 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #52525b; }
    .k { font: 600 11px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #71717a; letter-spacing: .06em; }
    .line { stroke: #a1a1aa; stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; }
    .doc { fill: #ececef; stroke: #a1a1aa; stroke-width: 1; } .ok { fill: none; stroke: #57a95b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .bar { fill: #e4e4e7; } .fill { fill: #4f8ef7; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18181b; } .box { fill: #232326; stroke: #3f3f46; } .h { fill: #f4f4f5; } .s { fill: #a1a1aa; } .k { fill: #a1a1aa; }
      .line { stroke: #71717a; } .doc { fill: #2c2c30; stroke: #71717a; } .bar { fill: #34343a; } .ok { stroke: #81c784; }
    }
    .d { opacity: 0; animation: fly 6s infinite ease-in-out; }
    .d2 { animation-delay: .5s; } .d3 { animation-delay: 1s; } .d4 { animation-delay: 1.5s; }
    @keyframes fly { 0% { opacity: 0; transform: translateX(0) } 6% { opacity: 1 } 34% { opacity: 1; transform: translateX(300px) } 40%,100% { opacity: 0; transform: translateX(300px) } }
    .fill { transform-box: fill-box; transform-origin: left; animation: grow 6s infinite ease-out; }
    @keyframes grow { 0%,5% { transform: scaleX(0) } 60%,92% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    .done { opacity: 0; animation: done 6s infinite; }
    @keyframes done { 0%,60% { opacity: 0 } 66%,92% { opacity: 1 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .d { display: none } .fill { animation: none } .done { animation: none; opacity: 1 } }
  </style>
  <rect class="bg" width="880" height="240" rx="14"/>

  <text class="k" x="32" y="44">CORD 2.X DATA</text>
  <rect class="box" x="32" y="62" width="250" height="130" rx="10"/>
  <text class="h" x="52" y="94">cord.db</text>
  <text class="s" x="52" y="116">notes, tags, attachments,</text>
  <text class="s" x="52" y="134">settings</text>
  <path class="ok" d="M54 166 l5 5 l10 -11"/>
  <text class="s" x="76" y="171">left exactly as it was</text>

  <path class="line" d="M282 127 H590"/>
  <text class="s" x="350" y="116">copied once, on first start</text>
  <rect class="doc d d1" x="290" y="119" width="14" height="17" rx="2"/>
  <rect class="doc d d2" x="290" y="119" width="14" height="17" rx="2"/>
  <rect class="doc d d3" x="290" y="119" width="14" height="17" rx="2"/>
  <rect class="doc d d4" x="290" y="119" width="14" height="17" rx="2"/>

  <text class="k" x="598" y="44">CORD 3.0</text>
  <rect class="box" x="598" y="62" width="250" height="130" rx="10"/>
  <text class="h" x="618" y="94">New format</text>
  <text class="s" x="618" y="116">built for sync between</text>
  <text class="s" x="618" y="134">devices (coming later)</text>
  <rect class="bar" x="618" y="156" width="210" height="6" rx="3"/>
  <rect class="fill" x="618" y="156" width="210" height="6" rx="3"/>
  <text class="s done" x="618" y="182">ready</text>
  <text class="s" x="32" y="222">If the copy is stopped halfway, it starts over cleanly next time.</text>
</svg>
