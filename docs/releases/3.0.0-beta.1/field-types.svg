<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="The six field types a tag can carry: text, number, checkbox, select, multi-select and date">
  <style>
    .bg { fill: #f4f4f5; } .card { fill: #ffffff; stroke: #dcdce0; }
    .t { font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #18181b; }
    .k { font: 500 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #71717a; letter-spacing: .04em; text-transform: uppercase; }
    .v { font: 400 15px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #18181b; }
    .m { font: 400 15px ui-monospace, 'Cascadia Mono', Menlo, monospace; fill: #18181b; }
    .box { fill: none; stroke: #18181b; stroke-width: 1.6; } .tick { fill: none; stroke: #18181b; stroke-width: 2; }
    .pill-t { font: 500 13px system-ui, -apple-system, 'Segoe UI', sans-serif; } .p1 { fill: #9a6416; } .p2 { fill: #93309f; } .p3 { fill: #1d736e; } .p4 { fill: #a93d33; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18181b; } .card { fill: #232326; stroke: #34343a; }
      .t, .v, .m { fill: #f4f4f5; } .k { fill: #a1a1aa; }
      .box, .tick { stroke: #f4f4f5; } .p1 { fill: #f5c271; } .p2 { fill: #e7a3f1; } .p3 { fill: #8be0db; } .p4 { fill: #f4a39b; }
    }
  </style>
  <rect class="bg" width="880" height="236" rx="14"/>
  <text class="t" x="28" y="40">A tag with fields turns everything it is on into a row</text>

  <!-- Row of six cards -->
  <g transform="translate(28 64)">
    <rect class="card" width="128" height="140" rx="10"/>
    <text class="k" x="16" y="30">Text</text>
    <text class="v" x="16" y="74">Donella</text>
    <text class="v" x="16" y="96">Meadows</text>
  </g>
  <g transform="translate(168 64)">
    <rect class="card" width="128" height="140" rx="10"/>
    <text class="k" x="16" y="30">Number</text>
    <text class="m" x="16" y="84" style="font-size:30px">5</text>
  </g>
  <g transform="translate(308 64)">
    <rect class="card" width="128" height="140" rx="10"/>
    <text class="k" x="16" y="30">Checkbox</text>
    <rect class="box" x="16" y="62" width="22" height="22" rx="5"/>
    <path class="tick" d="M21 73 l5 5 l9 -11"/>
    <text class="v" x="48" y="79">Read</text>
  </g>
  <g transform="translate(448 64)">
    <rect class="card" width="128" height="140" rx="10"/>
    <text class="k" x="16" y="30">Select</text>
    <rect x="16" y="60" width="74" height="26" rx="13" fill="#e8a33d" fill-opacity=".2"/>
    <circle cx="30" cy="73" r="4" fill="#e8a33d"/>
    <text class="pill-t p1" x="40" y="78">Doing</text>
  </g>
  <g transform="translate(588 64)">
    <rect class="card" width="128" height="140" rx="10"/>
    <text class="k" x="16" y="30">Multi-select</text>
    <rect x="16" y="60" width="52" height="26" rx="13" fill="#c55fd6" fill-opacity=".2"/>
    <text class="pill-t p2" x="29" y="78">Ola</text>
    <rect x="74" y="60" width="44" height="26" rx="13" fill="#3fb6b0" fill-opacity=".2"/>
    <text class="pill-t p3" x="86" y="78">Kai</text>
    <rect x="16" y="94" width="58" height="26" rx="13" fill="#e0675c" fill-opacity=".2"/>
    <text class="pill-t p4" x="29" y="112">Mira</text>
  </g>
  <g transform="translate(728 64)">
    <rect class="card" width="124" height="140" rx="10"/>
    <text class="k" x="16" y="30">Date</text>
    <text class="m" x="16" y="78">2026-11-13</text>
  </g>
</svg>
