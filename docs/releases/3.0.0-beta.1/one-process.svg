<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Before: the Cord app talked to a separate background process over a local connection. Now: the core runs inside the app.">
  <style>
    .bg { fill: #f4f4f5; } .box { fill: #ffffff; stroke: #c9c9cf; stroke-width: 1.4; } .inner { fill: #ececef; stroke: #c9c9cf; }
    .old { fill: #ffffff; stroke: #a1a1aa; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .h { font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #18181b; }
    .s { font: 400 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #52525b; }
    .k { font: 600 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #71717a; letter-spacing: .06em; }
    .line { stroke: #a1a1aa; stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; }
    .div { stroke: #dcdce0; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18181b; } .box { fill: #232326; stroke: #3f3f46; } .inner { fill: #2c2c30; stroke: #3f3f46; }
      .old { fill: #232326; stroke: #71717a; } .h { fill: #f4f4f5; } .s { fill: #a1a1aa; } .k { fill: #a1a1aa; }
      .line { stroke: #71717a; } .div { stroke: #34343a; }
    }
  </style>
  <rect class="bg" width="880" height="260" rx="14"/>
  <line class="div" x1="440" y1="24" x2="440" y2="236"/>

  <!-- Before -->
  <text class="k" x="32" y="44">CORD 2.X</text>
  <rect class="box" x="32" y="66" width="180" height="140" rx="10"/>
  <text class="h" x="50" y="96">Cord app</text>
  <text class="s" x="50" y="118">window, editor</text>
  <path class="line" d="M212 136 H262"/>
  <text class="s" x="220" y="128">HTTP</text>
  <rect class="old" x="262" y="66" width="160" height="140" rx="10"/>
  <text class="h" x="278" y="96">Background</text>
  <text class="h" x="278" y="116">process</text>
  <text class="s" x="278" y="140">notes, tags, search,</text>
  <text class="s" x="278" y="158">accounts</text>
  <text class="s" x="278" y="186">started on its own</text>

  <!-- After -->
  <text class="k" x="472" y="44">CORD 3.0</text>
  <rect class="box" x="472" y="66" width="376" height="140" rx="10"/>
  <text class="h" x="490" y="96">Cord app</text>
  <text class="s" x="490" y="118">window, editor</text>
  <rect class="inner" x="634" y="84" width="196" height="104" rx="8"/>
  <text class="h" x="652" y="112">Cord core</text>
  <text class="s" x="652" y="134">notes, tags, search,</text>
  <text class="s" x="652" y="152">accounts, agents</text>
  <text class="s" x="652" y="174">inside the app</text>
  <text class="s" x="490" y="232">One process: nothing extra to start, nothing to fail on its own.</text>
</svg>
