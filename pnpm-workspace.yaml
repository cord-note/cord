packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  es5-ext: true
  esbuild: true

# linkify-it reaches us only through @tiptap/pm -> prosemirror-markdown ->
# markdown-it. The DoS fix is a patch release, so pinning the floor here
# clears the advisory without dragging Tiptap across its 3.x major.
overrides:
  'linkify-it@<5.0.2': '^5.0.2'
