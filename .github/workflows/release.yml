name: Release

# Tagging is the trigger. Push an annotated tag whose name matches the version
# in tauri.conf.json (see the guard job) and this builds installers for every
# platform and attaches them to a draft GitHub release.
#
#   git tag -a v1.6.0 -m "Cord 1.6.0" && git push origin v1.6.0
#
# The release is left as a DRAFT. Nothing reaches users until you review the
# artifacts and publish it by hand.
on:
  push:
    tags: ['v*']
  # Lets you rehearse the whole matrix on a branch without creating a tag.
  # Artifacts are uploaded, but no release is touched.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # A mislabelled installer is worse than a failed build: it ships, and the
  # version people report bugs against is not the version they are running.
  # Cheap to check, so check it before spending forty minutes of matrix time.
  guard:
    name: tag matches manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag to tauri.conf.json, package.json and Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Compare only the release core. A prerelease tag like v1.7.0-beta.1
          # ships the 1.7.0 manifests on purpose: the suffix says which build of
          # 1.7.0 this is, not that the app is a different version. Everything
          # left of the first hyphen still has to match exactly.
          core="${tag%%-*}"
          conf=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          cargo=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')

          echo "tag=$tag  core=$core  tauri.conf=$conf  package.json=$pkg  Cargo.toml=$cargo"
          fail=0
          [ "$core" = "$conf" ]  || { echo "::error::tag core $core != tauri.conf.json $conf"; fail=1; }
          [ "$core" = "$pkg" ]   || { echo "::error::tag core $core != package.json $pkg"; fail=1; }
          [ "$core" = "$cargo" ] || { echo "::error::tag core $core != Cargo.toml $cargo"; fail=1; }
          exit $fail

  build:
    name: ${{ matrix.label }}
    needs: guard
    strategy:
      # One platform failing should not bin the artifacts that did build —
      # a partial draft release is still useful, and the draft is not public.
      fail-fast: false
      matrix:
        include:
          - label: Windows (x64)
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bun-target: bun-windows-x64
          # macos-latest is Apple Silicon. Intel Macs are deliberately not
          # built: it would need a macos-13 runner and a bun-darwin-x64 entry
          # in build:sidecar, and an unsigned .app cannot be opened normally
          # on either architecture until Developer ID signing exists.
          - label: macOS (Apple Silicon)
            os: macos-latest
            rust-target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
          # Pinned to 22.04, not ubuntu-latest. An AppImage links against the
          # glibc of the machine that built it, so building on 24.04 would
          # refuse to start on any older distro.
          - label: Linux (x64)
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.rust-target }}

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      # Only this runner's target. The three-target build in `build:sidecar`
      # exists for building every installer from one machine; here each runner
      # already is the platform it ships, so the other two are wasted minutes.
      # tauri-build resolves externalBin at build-script time and fails if the
      # binary for the host triple is missing, so this must precede the build.
      - name: Build the sidecar for this platform
        working-directory: apps/desktop
        # Explicitly bash: windows-latest defaults to PowerShell, which reads a
        # trailing backslash continuation as a dangling unary operator and dies
        # with "Missing expression after unary operator '--'".
        shell: bash
        run: |
          bun build --compile --target=${{ matrix.bun-target }} src/sidecar/index.ts \
            --outfile src-tauri/binaries/cord-sidecar-${{ matrix.rust-target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts. Without these the build still produces
          # installers, but latest.json carries no valid signature and every
          # client refuses the update — which is the safe direction to fail.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.rust-target }}
          # Only publish to a release when a tag drove the run. On a manual
          # dispatch these stay empty, so the action just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Cord {0}', github.ref_name) || '' }}
          releaseBody: |
            Unsigned builds. Installing them will show a warning:

            - **Windows** — SmartScreen reports an unrecognised app. Choose *More info* then *Run anyway*.
            - **macOS** — Gatekeeper refuses to open it. Right-click the app and choose *Open*, then confirm.
            - **Linux** — no warning. Install the `.deb` (Debian, Ubuntu) or the
              `.rpm` (Fedora), or `chmod +x` the AppImage if your file manager has
              not already. The `.deb` and `.rpm` leave updates to your package
              manager and will not prompt you; the AppImage updates itself.

            Cord keeps your notes in a local SQLite database — under
            `~/.local/share/cord/` on Linux, `~/.cord/` on macOS and Windows.
            Nothing is sent anywhere.
          releaseDraft: true
          # A hyphen in the tag (v1.7.0-beta.1) marks it a prerelease, so GitHub
          # labels it and does not present it as the latest stable download.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Emits the .sig files and the latest.json the app polls. Every
          # release must carry these, or clients on that version go stale
          # permanently — there is no way to update someone to the release
          # that would have fixed their updater.
          includeUpdaterJson: true

      # A second copy, independent of the release, so a manual dispatch still
      # produces something inspectable and a failed publish is not a lost build.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cord-${{ matrix.rust-target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14

  # Fedora's .rpm, built on Fedora. It cannot come from the ubuntu-22.04 runner:
  # the rpm's dependencies are resolved by name against the building
  # distribution, and Ubuntu has no package called webkit2gtk4.1. Building it
  # there would produce an rpm whose Requires nothing on Fedora satisfies.
  #
  # fedora:43 rather than the newest, because an rpm links against the glibc it
  # was built on and so installs on that release and later, never earlier. 43 is
  # the oldest Fedora still receiving updates (42 went EOL in May 2026), which
  # makes it the widest target. Move this forward when 43 goes EOL, not sooner.
  build_rpm:
    name: Fedora (x64 rpm)
    needs: guard
    runs-on: ubuntu-latest
    container: fedora:43

    steps:
      # The runner's own tooling is not in the container, and actions/checkout
      # silently degrades to a tarball download without git.
      - name: Install build tooling and Tauri system dependencies
        run: |
          dnf install -y \
            git tar gzip xz unzip which findutils curl \
            gcc gcc-c++ make openssl-devel \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel librsvg2-devel \
            appstream desktop-file-utils rpmlint

      - uses: actions/checkout@v4

      # The container runs as root over a directory owned by the runner user,
      # which git treats as dubious and refuses to read.
      - run: git config --global --add safe.directory '*'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Its own key: the same Rust target built against a different glibc and
          # a different webkit is not a cache the ubuntu-22.04 job can share.
          key: fedora-rpm

      - name: Build the sidecar for this platform
        working-directory: apps/desktop
        run: |
          bun build --compile --target=bun-linux-x64 src/sidecar/index.ts \
            --outfile src-tauri/binaries/cord-sidecar-x86_64-unknown-linux-gnu

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Only the rpm. The .deb and the AppImage come from the ubuntu-22.04
          # job on purpose — an AppImage built here would carry Fedora 43's glibc
          # and refuse to start on anything older, which is the entire reason
          # that job is pinned to 22.04.
          args: --target x86_64-unknown-linux-gnu --bundles rpm
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Cord {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The Linux job owns latest.json. An rpm is not an updater target, so
          # writing it from here would replace a complete manifest with one that
          # lists nothing the updater can install.
          includeUpdaterJson: false

      # Nothing downstream looks at the rpm's metadata, so assert it here. The
      # dependency names, the License tag and the icon sizes have all been wrong
      # at some point and none of them fail the build when they are.
      - name: Check the rpm
        run: |
          rpm=$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm                   -name '*.rpm' -print -quit)
          [ -n "$rpm" ] || { echo "::error::no rpm was produced"; exit 1; }
          rpm -qpi "$rpm"
          echo '--- requires ---'; rpm -qpR "$rpm"
          echo '--- files ---';    rpm -qpl "$rpm"

          rpm -qpR "$rpm" | grep -qx webkit2gtk4.1
          rpm -qpR "$rpm" | grep -qx gtk3
          rpm -qp --qf '%{LICENSE}' "$rpm" | grep -q 'AGPL-3.0-or-later'
          rpm -qpl "$rpm" | grep -qx /usr/bin/cord
          rpm -qpl "$rpm" | grep -qx /usr/bin/cord-sidecar
          rpm -qpl "$rpm" | grep -qx /usr/share/applications/Cord.desktop
          rpm -qpl "$rpm" | grep -qx /usr/share/metainfo/app.cord.desktop.metainfo.xml
          for size in 32x32 64x64 128x128 256x256 512x512; do
            rpm -qpl "$rpm" | grep -qx "/usr/share/icons/hicolor/$size/apps/cord.png"
          done

      # Proves dnf resolves the dependencies the rpm declares, then checks the
      # two files no other job validates.
      - name: Install it and validate the metadata
        run: |
          rpm=$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm                   -name '*.rpm' -print -quit)
          dnf install -y "$rpm"
          desktop-file-validate /usr/share/applications/Cord.desktop
          appstreamcli validate --no-net /usr/share/metainfo/app.cord.desktop.metainfo.xml

      # Informational. rpmlint is what a Fedora reviewer would run, but it is
      # strict about things a bundled app cannot help, so it does not gate.
      - name: rpmlint
        continue-on-error: true
        run: |
          rpm=$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm                   -name '*.rpm' -print -quit)
          rpmlint "$rpm"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cord-fedora-rpm
          path: |
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/**/*
          if-no-files-found: warn
          retention-days: 14

  # Builds the AUR PKGBUILD against the .deb this run just produced, in a real
  # Arch container. Nothing else checks it: the PKGBUILD is only exercised when
  # someone installs cord-bin, so without this a broken one ships and the first
  # report comes from a user.
  #
  # It points makepkg at the local artifact rather than the release URL, so it
  # works on branch rehearsals and prereleases, where no stable tag exists for
  # the PKGBUILD's own source line to resolve.
  verify_aur:
    name: AUR PKGBUILD
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tooling
        run: |
          pacman -Syu --noconfirm --needed git namcap appstream desktop-file-utils
          # Cord's actual runtime dependencies. Without them namcap cannot map a
          # linked library back to a package and reports every one as missing,
          # and pacman has nothing to resolve the package's depends against.
          pacman -S --noconfirm --needed webkit2gtk-4.1 gtk3 hicolor-icon-theme

      - uses: actions/checkout@v4

      - run: git config --global --add safe.directory '*'

      - uses: actions/download-artifact@v4
        with:
          name: cord-x86_64-unknown-linux-gnu
          path: artifact

      # makepkg refuses to run as root, and the container has no other user.
      - name: Create a build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Point the PKGBUILD at this run's .deb
        run: |
          deb=$(find artifact -name '*.deb' -print -quit)
          [ -n "$deb" ] || { echo "::error::no .deb in the build artifact"; exit 1; }
          cp "$deb" "packaging/aur/$(basename "$deb")"
          cd packaging/aur
          # A local source file, so makepkg neither downloads nor needs the
          # stable tag that only exists for a real release.
          sed -i "s|^source=.*|source=(\"\${_deb}\")|" PKGBUILD
          echo "--- PKGBUILD under test ---"
          cat PKGBUILD

      - name: makepkg
        run: |
          chown -R builder packaging/aur
          cd packaging/aur
          sudo -u builder makepkg --noconfirm --skipchecksums

      # namcap exits 0 whatever it finds, so a bare call proves nothing. Error
      # lines gate; warnings are printed and tolerated - the Bun sidecar is
      # unstripped and lacks PIE on purpose, and neither is fixable here.
      - name: namcap
        run: |
          cd packaging/aur
          namcap PKGBUILD ./*.pkg.tar.zst | tee namcap.txt
          if grep -q ' E: ' namcap.txt; then
            echo '::error::namcap reported errors'
            grep ' E: ' namcap.txt
            exit 1
          fi

      # Proves pacman accepts the package and that the files land where the
      # desktop entry and the icon theme expect them.
      - name: Install it and check the layout
        run: |
          cd packaging/aur
          pacman -U --noconfirm ./*.pkg.tar.zst
          set -x
          test -x /usr/bin/cord
          test -x /usr/bin/cord-sidecar
          test -f /usr/share/applications/Cord.desktop
          test -f /usr/share/metainfo/app.cord.desktop.metainfo.xml
          for size in 32x32 64x64 128x128 256x256 512x512; do
            test -f "/usr/share/icons/hicolor/$size/apps/cord.png"
          done
          pacman -Ql cord-bin | head -40

      # The only check these two files get. appstreamcli is strict about the
      # metainfo, and a .desktop file that fails validation is one GNOME and
      # KDE may quietly refuse to show.
      - name: Validate the desktop entry and AppStream metadata
        run: |
          desktop-file-validate /usr/share/applications/Cord.desktop
          appstreamcli validate --no-net /usr/share/metainfo/app.cord.desktop.metainfo.xml

      # Downloadable from the run. Until there is an AUR account this is the
      # only way to try cord-bin without waiting for a release.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cord-arch-package
          path: packaging/aur/*.pkg.tar.zst
          if-no-files-found: warn
          retention-days: 14
